<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Realistic Space • Cosmic Fist Assembly</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      background-color: #010103;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
      cursor: grab;
    }

    #webgl-canvas:active {
      cursor: grabbing;
    }

    .vignette-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(1, 2, 5, 0.45) 85%, rgba(0, 1, 3, 0.85) 100%);
    }

    
    .nav-hud {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }

    .nav-badge {
      background: rgba(14, 20, 32, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 12px;
      padding: 9px 18px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .nav-badge:hover {
      background: rgba(24, 38, 62, 0.9);
      border-color: rgba(56, 189, 248, 0.6);
      transform: translateY(-1px);
    }

    .nav-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #94a3b8;
      font-weight: 700;
    }

    .nav-val {
      font-size: 14px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 1px;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    }

    .nav-flight-indicator {
      display: none;
      background: rgba(16, 185, 129, 0.85);
      border: 1px solid #34d399;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #fff;
      box-shadow: 0 0 18px rgba(16, 185, 129, 0.65);
      animation: pulseFlight 1.2s infinite alternate ease-in-out;
    }

    .nav-flight-indicator.active {
      display: inline-block;
    }

    @keyframes pulseFlight {
      from { transform: scale(1); opacity: 0.85; }
      to { transform: scale(1.04); opacity: 1; }
    }

    .blink-notification {
      position: fixed;
      top: 15%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: rgba(14, 20, 36, 0.88);
      border: 1px solid #38bdf8;
      padding: 9px 24px;
      border-radius: 999px;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.55);
      pointer-events: none;
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 30;
    }

    .blink-notification.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.0);
    }

    
    .top-dock {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    .cam-btn {
      background: rgba(14, 20, 32, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .cam-btn:hover {
      background: rgba(40, 60, 95, 0.85);
      border-color: rgba(120, 200, 255, 0.6);
      transform: translateY(-1px);
    }

    .cam-btn.active {
      background: rgba(16, 85, 140, 0.85);
      border-color: #38bdf8;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
    }

    
    .pip-wrapper {
      position: relative;
      width: 140px;
      height: 105px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #050810;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      display: none;
      transition: all 0.3s ease;
    }

    .pip-wrapper.active {
      display: block;
    }

    #pip-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); 
    }

    .pip-status {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      color: #94a3b8;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .pip-status.flight {
      color: #a78bfa;
      text-shadow: 0 0 8px rgba(167, 139, 250, 0.5);
    }

    .pip-status.fist {
      background: rgba(234, 88, 12, 0.85);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(249, 115, 22, 0.7);
    }

    .pip-status.open {
      background: rgba(16, 185, 129, 0.85);
      color: #ffffff;
    }

    
    .hold-fist-btn {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(14, 20, 32, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: rgba(255, 255, 255, 0.85);
      font-size: 13px;
      font-weight: 500;
      padding: 9px 22px;
      border-radius: 999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .hold-fist-btn:active, .hold-fist-btn.active {
      background: rgba(234, 88, 12, 0.85);
      color: #fff;
      border-color: #f97316;
      box-shadow: 0 0 24px rgba(249, 115, 22, 0.6);
      transform: translateX(-50%) scale(1.04);
    }

    
    .sound-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 10;
      background: rgba(14, 18, 28, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.55);
      cursor: pointer;
      opacity: 0.7;
      transition: all 0.4s ease;
    }

    .sound-toggle:hover {
      opacity: 1;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      transform: scale(1.06);
    }

    .sound-toggle svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    
    .interaction-hint {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: rgba(255, 255, 255, 0.35);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      pointer-events: none;
      transition: opacity 1.2s ease;
    }

    .interaction-hint.fade-out {
      opacity: 0;
    }
  
    
    .planet-card {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 25;
      background: rgba(10, 15, 28, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.35);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 14px;
      padding: 16px 20px;
      width: 290px;
      color: #fff;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 20px rgba(56, 189, 248, 0.15);
      transition: all 0.35s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .planet-card-header {
      display: flex;
      flex-direction: column;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }

    .planet-card-type {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #38bdf8;
      text-transform: uppercase;
    }

    .planet-card-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .planet-card-body {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 11px;
      margin-bottom: 14px;
    }

    .pc-stat {
      display: flex;
      justify-content: space-between;
      color: rgba(255, 255, 255, 0.65);
    }

    .pc-stat strong {
      color: #f8fafc;
      font-weight: 600;
      text-align: right;
    }

    .planet-card-actions {
      display: flex;
      gap: 8px;
    }

    .pc-btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .pc-btn.land-btn {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #ffffff;
      box-shadow: 0 0 15px rgba(2, 132, 199, 0.45);
    }

    .pc-btn.land-btn:hover {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      transform: translateY(-2px);
      box-shadow: 0 0 22px rgba(14, 165, 233, 0.65);
    }

    .pc-btn.warp-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f1f5f9;
    }

    .pc-btn.warp-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: translateY(-2px);
    }

    
    .reentry-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(249, 115, 22, 0.25) 75%, rgba(239, 68, 68, 0.55) 100%);
      transition: opacity 0.5s ease;
    }

    
    .target-reticle {
      position: fixed;
      width: 44px;
      height: 44px;
      border: 1px dashed #38bdf8;
      border-radius: 50%;
      pointer-events: none;
      z-index: 15;
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity 0.3s ease;
      animation: rotateReticle 12s linear infinite;
    }
    @keyframes rotateReticle {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>
  <div class="vignette-overlay"></div>

    <section class="review-panel">
      <h2>Your Feedback</h2>
      <form id="review-form">
        <label>Name: <input type="text" name="name" required></label><br>
        <label>College/School: <input type="text" name="institution" required></label><br>
        <label>Rating:
          <select name="rating" required>
            <option value="">Select</option>
            <option value="1">1 ⭐</option>
            <option value="2">2 ⭐</option>
            <option value="3">3 ⭐</option>
            <option value="4">4 ⭐</option>
            <option value="5">5 ⭐</option>
          </select>
        </label><br>
        <label>Suggestions:<br><textarea name="suggestions" rows="3"></textarea></label><br>
        <button type="submit">Submit</button>
      </form>
    </section>
    </section>
    <script>
      const form = document.getElementById('review-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
          name: form.name.value,
          institution: form.institution.value,
          rating: form.rating.value,
          suggestions: form.suggestions.value,
        };
        try {
          const resp = await fetch('http://127.0.0.1:5002/review', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data),
          });
          if (resp.ok) alert('Thanks for your feedback!');
          else alert('Submission failed');
        } catch (err) { alert('Error sending feedback'); }
      });
    </script>
    <div class="top-dock">
    <button class="cam-btn" id="btn-camera" onclick="toggleCamera()">
      <span id="cam-icon">📹</span>
      <span id="cam-label">Open Camera</span>
    </button>
    <div class="pip-wrapper" id="pip-box">
      <video id="pip-video" autoplay playsinline muted></video>
      <div class="pip-status" id="pip-status">Initializing...</div>
    </div>
  </div>

  <div class="reentry-overlay" id="reentry-overlay"></div>

  <button class="sound-toggle" id="btn-audio" title="Toggle sound" onclick="toggleAudio()">
    <svg id="audio-icon-off" viewBox="0 0 24 24">
      <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
    </svg>
    <svg id="audio-icon-on" viewBox="0 0 24 24" style="display:none;">
      <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
    </svg>
  </button>

  <script>
    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    const cosmosScene = new THREE.Scene();
    cosmosScene.background = new THREE.Color(0x000000);
    cosmosScene.fog = new THREE.FogExp2(0x000000, 0.00002);

    const camera = new THREE.PerspectiveCamera(56, window.innerWidth / window.innerHeight, 0.1, 120000);
    camera.position.set(0, 0, 50);
    camera.rotation.order = 'YXZ';

    const loader = new THREE.FontLoader();
    loader.load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_regular.typeface.json', (font) => {
      const textGeo = new THREE.TextGeometry('Built by Sital Kumar', {
        font: font,
        size: 12,
        height: 2,
        curveSegments: 12,
        bevelEnabled: false,
      });
      textGeo.computeBoundingBox();
      const centerOffset = -0.5 * (textGeo.boundingBox.max.x - textGeo.boundingBox.min.x);
      const particles = new THREE.BufferGeometry();
      const positions = [];
      const vertices = textGeo.attributes ? textGeo.attributes.position.array : [];
      for (let i = 0; i < vertices.length; i += 3) {
        positions.push(vertices[i] + centerOffset, vertices[i + 1], vertices[i + 2]);
      }
      particles.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      const particleMat = new THREE.PointsMaterial({
        color: 0xffd700,
        size: 0.4,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const textParticles = new THREE.Points(particles, particleMat);
      textParticles.position.set(2000, 300, -4000);
      cosmosScene.add(textParticles);
    });

    const sunLight = new THREE.DirectionalLight(0xfff5ea, 3.2);
    sunLight.position.set(120, 75, 90);
    cosmosScene.add(sunLight);

    const ambientStarlight = new THREE.AmbientLight(0x0a1020, 0.45);
    cosmosScene.add(ambientStarlight);

    const rimLight = new THREE.DirectionalLight(0x355580, 0.95);
    rimLight.position.set(-110, -50, -80);
    cosmosScene.add(rimLight);


    let targetRotationX = 0;
    let targetRotationY = 0;
    let rotationX = 0;
    let rotationY = 0;
    let targetCameraZ = 50;
    let cameraZ = 50;
    let targetCameraX = 0;
    let cameraX = 0;
    let targetCameraY = 0;
    let cameraY = 0;

    let targetHandWorldPos = new THREE.Vector3(0, 0, 18);
    let currentHandWorldPos = new THREE.Vector3(0, 0, 18);
    let handTrackingActive = false;
    let isPinkyFlyingBackward = false;
    let headTrackingActive = false;
    let headSteerYaw = 0;
    let headSteerPitch = 0;
    let handSteerYaw = 0;
    let handSteerPitch = 0;
    let isKeyboardTurnLeft = false;
    let isKeyboardTurnRight = false;
    let screenShakeIntensity = 0.0;

    let isPointerDown = false;
    let previousPointerPosition = { x: 0, y: 0 };

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.top-dock') || e.target.closest('.hold-fist-btn') || e.target.closest('.sound-toggle')) return;
      isPointerDown = true;
      previousPointerPosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointermove', (e) => {
      const normX = (e.clientX / window.innerWidth - 0.5) * 2;
      const normY = -(e.clientY / window.innerHeight - 0.5) * 2;

      if (!handTrackingActive && typeof dualFists !== 'undefined' && dualFists.length >= 2) {
        dualFists[0].targetWorldPos.x = -13 + normX * 26;
        dualFists[0].targetWorldPos.y = normY * 24;
        dualFists[1].targetWorldPos.x = 13 + normX * 26;
        dualFists[1].targetWorldPos.y = normY * 24;

        targetRotationY = -normX * 0.42;
        targetRotationX = -normY * 0.32;
        targetCameraX = normX * 12;
        targetCameraY = normY * 9;
      }

      if (isPointerDown) {
        const deltaX = e.clientX - previousPointerPosition.x;
        const deltaY = e.clientY - previousPointerPosition.y;
        targetRotationY += deltaX * 0.0022;
        targetRotationX += deltaY * 0.0022;
        targetRotationX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, targetRotationX));
        previousPointerPosition = { x: e.clientX, y: e.clientY };
      }
    });

    window.addEventListener('pointerup', () => { isPointerDown = false; });
    window.addEventListener('wheel', (e) => {
      if (e.shiftKey && typeof dualFists !== 'undefined' && dualFists.length >= 2) {

        dualFists[0].targetWorldPos.z -= e.deltaY * 0.05;
        dualFists[0].targetWorldPos.z = THREE.MathUtils.clamp(dualFists[0].targetWorldPos.z, -30, 25);
        dualFists[1].targetWorldPos.z -= e.deltaY * 0.05;
        dualFists[1].targetWorldPos.z = THREE.MathUtils.clamp(dualFists[1].targetWorldPos.z, -30, 25);
      } else {
        targetCameraZ += e.deltaY * 0.25;
        targetCameraZ = Math.max(-600, Math.min(600, targetCameraZ));
      }
    }, { passive: true });

    
    const UNIVERSE_BOUNDARY_RADIUS = 4200;
    const boundaryDomeGeo = new THREE.SphereGeometry(UNIVERSE_BOUNDARY_RADIUS, 48, 32);
    const boundaryDomeMat = new THREE.MeshBasicMaterial({
      color: 0x38bdf8,
      wireframe: true,
      transparent: true,
      opacity: 0.04,
      side: THREE.BackSide
    });
    const boundaryDome = new THREE.Mesh(boundaryDomeGeo, boundaryDomeMat);
    cosmosScene.add(boundaryDome);
    let deityAstralGroup = new THREE.Group();
    deityAstralGroup.visible = false;
    cosmosScene.add(deityAstralGroup);
    let deityParticleSystem = null;
    let deityAstralMesh = null;
    let deityAuraMesh = null;
    let deityHaloMesh = null;
    let deityTargetCoords = null;
    let deityOriginalColors = null;
    let deityScatterCoords = null;
    let deityParticleCount = 0;
    let deityFormationProgress = 0.0;
    let isAtBoundary = false;

    const deityTexLoader = new THREE.TextureLoader();
    deityTexLoader.load('deity_cutout.png', (tex) => {
      tex.encoding = THREE.sRGBEncoding;
      const planeGeo = new THREE.PlaneGeometry(120.00, 107.63);
      const astralMat = new THREE.MeshBasicMaterial({
        map: tex,
        transparent: true,
        opacity: 0.0,
        depthWrite: false,
        side: THREE.DoubleSide
      });
      deityAstralMesh = new THREE.Mesh(planeGeo, astralMat);
      deityAstralMesh.position.set(8.21, 8.18, 0.5);
      deityAstralGroup.add(deityAstralMesh);

      const auraGeo = new THREE.PlaneGeometry(126.0, 113.0);
      const auraMat = new THREE.MeshBasicMaterial({
        map: tex,
        color: 0x7dd3fc,
        transparent: true,

    function createAsteroidMaps() {
      const size = 512;

      bCtx.fillStyle = '#808080';
      bCtx.fillRect(0, 0, size, size);

      for (let i = 0; i < 45; i++) {
        const cx = Math.random() * size;
        const cy = Math.random() * size;
        const cr = 6 + Math.pow(Math.random(), 2.5) * 55;
        const bGrad = bCtx.createRadialGradient(cx, cy, 0, cx, cy, cr);
        bGrad.addColorStop(0, 'rgba(20, 20, 20, 0.85)');
        bGrad.addColorStop(0.9, 'rgba(255, 255, 255, 0.85)');
        bGrad.addColorStop(1, 'rgba(128, 128, 128, 0)');
        bCtx.fillStyle = bGrad;
        bCtx.beginPath();
        bCtx.arc(cx, cy, cr, 0, Math.PI * 2);
        bCtx.fill();
      }

      return {
        map: new THREE.CanvasTexture(dCanvas),
        bumpMap: new THREE.CanvasTexture(bCanvas)
      };
    }

    function createAsteroidGeometry(radius, detail = 3, seed = 1) {
      const geo = new THREE.IcosahedronGeometry(radius, detail);
      const pos = geo.attributes.position;
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        const dir = v.clone().normalize();
        const d1 = Math.sin(dir.x * 2.3 + seed) * Math.cos(dir.y * 2.7) * Math.sin(dir.z * 2.4);
        const d2 = Math.cos(dir.x * 5.8 + dir.z * 4.9) * 0.35;
        const displacement = 1.0 + (d1 * 0.36 + d2 * 0.18);
        v.multiplyScalar(displacement);
        pos.setXYZ(i, v.x, v.y, v.z);
      }
      geo.computeVertexNormals();
      return geo;
    }

    function spawnDebris(origin, count, impactDir, power) {
      let spawned = 0;
      for (let i = 0; i < maxDebris && spawned < count; i++) {
        if (debrisLifespans[i] <= 0) {
          debrisPositions[i * 3]     = origin.x + (Math.random() - 0.5) * 2;
          debrisPositions[i * 3 + 1] = origin.y + (Math.random() - 0.5) * 2;
          debrisPositions[i * 3 + 2] = origin.z + (Math.random() - 0.5) * 2;

          const spread = new THREE.Vector3(
            (Math.random() - 0.5) * 1.6,
            (Math.random() - 0.5) * 1.6,
            (Math.random() - 0.5) * 1.6
          );
          spread.addScaledVector(impactDir, 1.4).normalize();
          const speed = (22 + Math.random() * 38) * power;

          debrisVelocities[i * 3]     = spread.x * speed;
          debrisVelocities[i * 3 + 1] = spread.y * speed;
          debrisVelocities[i * 3 + 2] = spread.z * speed;
          debrisLifespans[i] = 1.0;

          const isFire = Math.random() > 0.45;
          debrisColors[i * 3]     = 1.0;
          debrisColors[i * 3 + 1] = isFire ? 0.65 : 0.95;
          debrisColors[i * 3 + 2] = isFire ? 0.18 : 0.85;

          spawned++;
        }
      }
      debrisGeo.attributes.position.needsUpdate = true;
      debrisGeo.attributes.color.needsUpdate = true;
    }

    function createKeplerTexture() {
      const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#064e3b'; ctx.fillRect(0, 0, 1024, 512); 

      const biomes = ['#831843', '#047857', '#4c1d95', '#0e7490', '#065f46'];
      for (let i = 0; i < 400; i++) {
        const x = Math.random() * 1024, y = Math.random() * 512;
        ctx.beginPath();
        ctx.arc(x, y, Math.random() * 38 + 12, 0, Math.PI * 2);
        ctx.fillStyle = biomes[Math.floor(Math.random() * biomes.length)];
        ctx.fill();
      }
      return new THREE.CanvasTexture(c);
    }

    function createProximaBTexture() {
      const c = document.createElement('canvas'); c.width = 512; c.height = 256;
      const ctx = c.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 512, 0);
      grad.addColorStop(0.0, '#451a03'); grad.addColorStop(0.45, '#78350f');
      grad.addColorStop(0.55, '#065f46'); grad.addColorStop(1.0, '#0f172a'); 
      ctx.fillStyle = grad; ctx.fillRect(0, 0, 512, 256);
      return new THREE.CanvasTexture(c);
    }

    function createWaspTexture() {
      const c = document.createElement('canvas'); c.width = 512; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#1c1917'; ctx.fillRect(0, 0, 512, 256);

      for (let i = 0; i < 45; i++) {
        ctx.beginPath();
        const y = Math.random() * 256;
        ctx.ellipse(256, y, 260, Math.random() * 8 + 2, 0.1, 0, Math.PI * 2);
        ctx.fillStyle = Math.random() < 0.5 ? 'rgba(239, 68, 68, 0.8)' : 'rgba(249, 115, 22, 0.85)';
        ctx.fill();
      }
      return new THREE.CanvasTexture(c);
    }


    function createAlienPlantBiome(planetMesh, planetRadius, plantCount = 70) {
      const floraGroup = new THREE.Group();
      planetMesh.add(floraGroup);

      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.85 });
      const bioCyanMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, blending: THREE.AdditiveBlending });
      const bioVioletMat = new THREE.MeshBasicMaterial({ color: 0xc084fc, blending: THREE.AdditiveBlending });
      const bioEmeraldMat = new THREE.MeshBasicMaterial({ color: 0x34d399, blending: THREE.AdditiveBlending });

      for (let i = 0; i < plantCount; i++) {
        const plant = new THREE.Group();

        const u = Math.random(), v = Math.random();
        const theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0);
        const normal = new THREE.Vector3(
          Math.sin(phi) * Math.cos(theta),
          Math.sin(phi) * Math.sin(theta),
          Math.cos(phi)
        );

        plant.position.copy(normal).multiplyScalar(planetRadius);
        plant.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);

        const plantType = Math.random();
        if (plantType < 0.35) {

          const trunkGeo = new THREE.CylinderGeometry(0.12, 0.35, 2.8, 6);
          const trunk = new THREE.Mesh(trunkGeo, trunkMat);
          trunk.position.y = 1.4;
          plant.add(trunk);

          const canopyGeo = new THREE.SphereGeometry(1.2, 12, 12);
          const canopy = new THREE.Mesh(canopyGeo, Math.random() < 0.5 ? bioCyanMat : bioVioletMat);
          canopy.position.y = 2.8;
          canopy.scale.set(1.4, 0.7, 1.4);
          plant.add(canopy);
        } else if (plantType < 0.70) {

          const stalkGeo = new THREE.CylinderGeometry(0.18, 0.28, 1.8, 6);
          const stalk = new THREE.Mesh(stalkGeo, trunkMat);
          stalk.position.y = 0.9;
          plant.add(stalk);

          const capGeo = new THREE.ConeGeometry(1.1, 0.8, 12);
          const cap = new THREE.Mesh(capGeo, bioEmeraldMat);
          cap.position.y = 1.8;
          plant.add(cap);
        } else {

          const tendrilGeo = new THREE.TorusGeometry(0.8, 0.15, 8, 16, Math.PI * 1.5);
          const tendril = new THREE.Mesh(tendrilGeo, bioCyanMat);
          tendril.position.y = 0.8;
          tendril.rotation.x = Math.PI / 2;
          plant.add(tendril);
        }

        floraGroup.add(plant);
      }
      return floraGroup;
    }

    function generateFistPointCloud(count, isLeft = false) {
      const targets = new Float32Array(count * 3);
      const scale = 2.8;

      for (let i = 0; i < count; i++) {
        let x, y, z;
        const part = Math.random();

        if (part < 0.30) {

          x = (Math.random() - 0.5) * 3.2;
          y = -1.2 + (Math.random() - 0.5) * 2.8;
          z = (Math.random() - 0.5) * 1.8;
        } else if (part < 0.70) {

          const fingerIndex = Math.floor(Math.random() * 4);
          const fingerX = -1.35 + fingerIndex * 0.9 + (Math.random() - 0.5) * 0.18;
          const curlAngle = Math.random() * Math.PI * 1.3;
          const curlRadius = 0.95 + (Math.random() - 0.5) * 0.15;
          x = fingerX;
          y = 0.5 + Math.cos(curlAngle) * curlRadius;
          z = 0.75 + Math.sin(curlAngle) * curlRadius;
        } else if (part < 0.86) {

          const t = Math.random();
          x = -1.5 + t * 2.0 + (Math.random() - 0.5) * 0.2;
          y = -1.0 + t * 0.8 + (Math.random() - 0.5) * 0.2;
          z = 1.4 + (Math.random() - 0.5) * 0.3;
        } else if (part < 0.95) {

          const kIdx = Math.floor(Math.random() * 4);
          x = -1.35 + kIdx * 0.9 + (Math.random() - 0.5) * 0.15;
          y = 1.5 + (Math.random() - 0.5) * 0.25;

          x = (Math.random() - 0.5) * 2.2;
          y = -3.4 - Math.random() * 1.8;
          z = (Math.random() - 0.5) * 1.6;
        }

        if (isLeft) x = -x;

        targets[i * 3]     = x * scale;
        targets[i * 3 + 1] = y * scale;
        targets[i * 3 + 2] = z * scale;
      }
      return targets;
    }

    function buildConvergenceDelays(count, fistTargets) {
      const delays = new Float32Array(count);
      let maxDist = 0;
      for (let i = 0; i < count; i++) {
        const dx = fistTargets[i * 3];
        const dy = fistTargets[i * 3 + 1];
        const dz = fistTargets[i * 3 + 2];
        const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
        delays[i] = d;
        if (d > maxDist) maxDist = d;
      }
      for (let i = 0; i < count; i++) {
        delays[i] = delays[i] / (maxDist + 0.0001);
      }
      return delays;
    }

    function triggerWarpChime() {
      if (!audioCtx) initAudio();
      audioCtx.resume();
      const t = audioCtx.currentTime;

      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      const gain2 = audioCtx.createGain();

      osc1.type = 'sine';
      osc2.type = 'triangle';
      osc1.frequency.setValueAtTime(528, t);
      osc1.frequency.exponentialRampToValueAtTime(792, t + 0.6);
      osc2.frequency.setValueAtTime(1056, t);
      osc2.frequency.exponentialRampToValueAtTime(1584, t + 0.7);

      gain1.gain.setValueAtTime(0.28, t);
      gain1.gain.exponentialRampToValueAtTime(0.001, t + 0.85);
      gain2.gain.setValueAtTime(0.18, t);
      gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.95);

      osc1.connect(gain1);
      osc2.connect(gain2);
      gain1.connect(audioCtx.destination);
      gain2.connect(audioCtx.destination);

      osc1.start(t);
      osc2.start(t);
      osc1.stop(t + 0.9);
      osc2.stop(t + 1.0);
    }

    async function startCamera() {
      camLabel.textContent = "Connecting...";
      pipBox.classList.add('active');

      try {

        handsInstance = new Hands({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        handsInstance.setOptions({
          maxNumHands: 2,
          modelComplexity: 1,
          minDetectionConfidence: 0.65,
          minTrackingConfidence: 0.65
        });
        handsInstance.onResults(onHandResults);

        faceMeshInstance = new FaceMesh({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });
        faceMeshInstance.setOptions({
          maxNumFaces: 1,
          refineLandmarks: true,
          minDetectionConfidence: 0.6,
          minTrackingConfidence: 0.6
        });
        faceMeshInstance.onResults(onFaceResults);

        cameraInstance = new Camera(pipVideo, {
          facingMode: 'user',
          onFrame: async () => {
            if (!isCameraActive) return;
            cameraFrameCounter++;

            if (cameraFrameCounter % 2 === 0) {
              await handsInstance.send({ image: pipVideo });
            } else if (faceMeshInstance) {
              await faceMeshInstance.send({ image: pipVideo });
            }
          },
          width: 320,
          height: 240
        });

        await cameraInstance.start();
        isCameraActive = true;
        camBtn.classList.add('active');
        camLabel.textContent = "Close Camera";
        pipStatus.textContent = "Show Hands / Blink Eyes";
      } catch (err) {

    function onFaceResults(results) {
      if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
        headTrackingActive = false;
        headSteerYaw = 0;
        headSteerPitch = 0;
        return;
      }
      const lm = results.multiFaceLandmarks[0];

      const faceCenterX = (lm[234].x + lm[454].x) * 0.5;
      const faceWidth = Math.abs(lm[454].x - lm[234].x) + 1e-6;
      const noseYaw = -((lm[1].x - faceCenterX) / faceWidth);
      const leanYaw = (0.5 - lm[1].x) * 1.6;
      const rawYaw = noseYaw * 0.65 + leanYaw * 0.35;

      const faceCenterY = (lm[10].y + lm[152].y) * 0.5;
      const faceHeight = Math.abs(lm[152].y - lm[10].y) + 1e-6;
      const nosePitch = -((lm[1].y - faceCenterY) / faceHeight);
      const leanPitch = (0.48 - lm[1].y) * 1.4;
      const rawPitch = nosePitch * 0.65 + leanPitch * 0.35;

      const deadzone = 0.075;
      headSteerYaw = Math.abs(rawYaw) > deadzone ? (rawYaw - Math.sign(rawYaw) * deadzone) * 1.9 : 0;
      headSteerPitch = Math.abs(rawPitch) > deadzone ? (rawPitch - Math.sign(rawPitch) * deadzone) * 1.4 : 0;
      headTrackingActive = true;
    }

    function onHandResults(results) {
      const numHands = results.multiHandLandmarks ? results.multiHandLandmarks.length : 0;

      if (numHands === 0) {
        pipStatus.textContent = "No Hand Detected";
        pipStatus.className = "pip-status";
        handTrackingActive = false;
        handSteerYaw = 0;
        handSteerPitch = 0;
        dualFists[0].tracked = false;
        dualFists[1].tracked = false;
        isTwoFingerFlying = false;
        if (flightIndicatorEl) flightIndicatorEl.classList.remove('active');
        if (!isManualHeld) {
          dualFists[0].isClenched = false;
          dualFists[1].isClenched = false;
        }
        return;
      }

      handTrackingActive = true;

      const detected = [];
      let anyTwoFingerActive = false;
      let anyPinkyBackwardActive = false;

      for (let h = 0; h < numHands; h++) {
        const lm = results.multiHandLandmarks[h];
        const wrist = lm[0];
        const handNormX = 1.0 - lm[9].x; 
        const handNormY = lm[9].y;       

        const handSpan = Math.hypot(lm[0].x - lm[9].x, lm[0].y - lm[9].y);
        const punchDepth = THREE.MathUtils.clamp((handSpan - 0.16) / 0.16, -0.6, 1.8);

        function dist(p1, p2) {
          return Math.hypot(p1.x - p2.x, p1.y - p2.y, (p1.z || 0) - (p2.z || 0));
        }

        const indexCurled  = dist(lm[8], wrist) < dist(lm[6], wrist) * 1.05;
        const middleCurled = dist(lm[12], wrist) < dist(lm[10], wrist) * 1.05;
        const ringCurled   = dist(lm[16], wrist) < dist(lm[14], wrist) * 1.05;
        const pinkyCurled  = dist(lm[20], wrist) < dist(lm[18], wrist) * 1.05;

        const fistClenched = indexCurled && middleCurled && ringCurled && pinkyCurled;



        const indexRaised  = dist(lm[8], wrist) > dist(lm[6], wrist) * 1.25;
        const indexLowered = dist(lm[8], wrist) < dist(lm[6], wrist) * 1.15;
        const middleLowered = dist(lm[12], wrist) < dist(lm[10], wrist) * 1.15;
        const ringLowered   = dist(lm[16], wrist) < dist(lm[14], wrist) * 1.15;
        const pinkyRaised  = dist(lm[20], wrist) > dist(lm[18], wrist) * 1.25;
        const pinkyLowered  = dist(lm[20], wrist) < dist(lm[18], wrist) * 1.15;

        const indexFingerFlight = indexRaised && (middleLowered || ringLowered || pinkyLowered);
        const pinkyFingerFlight = pinkyRaised && indexLowered && middleLowered && ringLowered;

        if (indexFingerFlight) {
          anyTwoFingerActive = true;
        }
        if (pinkyFingerFlight) {
          anyPinkyBackwardActive = true;
        }

        detected.push({
          lm,
          handNormX,
          handNormY,
          punchDepth,
          fistClenched,
          indexFingerFlight
        });
      }

      isTwoFingerFlying = anyTwoFingerActive;
      isPinkyFlyingBackward = anyPinkyBackwardActive;
      if (flightIndicatorEl) {
        flightIndicatorEl.classList.toggle('active', isTwoFingerFlying || isPinkyFlyingBackward);
      }

      detected.sort((a, b) => a.handNormX - b.handNormX);

      const avgNormX = detected.reduce((sum, d) => sum + d.handNormX, 0) / detected.length;
      const avgNormY = detected.reduce((sum, d) => sum + d.handNormY, 0) / detected.length;

      const handOffsetX = avgNormX - 0.5;
      const handOffsetY = -(avgNormY - 0.5);
      const handDeadzone = 0.20;
      handSteerYaw = Math.abs(handOffsetX) > handDeadzone ? -(handOffsetX - Math.sign(handOffsetX) * handDeadzone) * 3.2 : 0;
      handSteerPitch = Math.abs(handOffsetY) > handDeadzone ? (handOffsetY - Math.sign(handOffsetY) * handDeadzone) * 2.4 : 0;

      if (detected.length >= 2) {

        const leftData = detected[0];
        const rightData = detected[1];

        dualFists[0].tracked = true;
        dualFists[0].targetWorldPos.x = (leftData.handNormX - 0.5) * 62;
        dualFists[0].targetWorldPos.y = -(leftData.handNormY - 0.5) * 44;
        dualFists[0].targetWorldPos.z = 18 - leftData.punchDepth * 28;
        dualFists[0].isClenched = leftData.fistClenched || isManualHeld;

        dualFists[1].tracked = true;
        dualFists[1].targetWorldPos.x = (rightData.handNormX - 0.5) * 62;
        dualFists[1].targetWorldPos.y = -(rightData.handNormY - 0.5) * 44;
        dualFists[1].targetWorldPos.z = 18 - rightData.punchDepth * 28;

    let audioCtx = null;
    let isAudioPlaying = false;
    let masterGain = null;

    function initAudio() {
      if (audioCtx) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.0001;
      masterGain.connect(audioCtx.destination);

      const bufferSize = audioCtx.sampleRate * 2;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      let lastOut = 0.0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        output[i] = (lastOut + (0.02 * white)) / 1.02;
        lastOut = output[i];
        output[i] *= 3.0;
      }

      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = noiseBuffer;
      whiteNoise.loop = true;
      const lowFilter = audioCtx.createBiquadFilter();
      lowFilter.type = 'lowpass';
      lowFilter.frequency.value = 130;
      whiteNoise.connect(lowFilter);
      lowFilter.connect(masterGain);
      whiteNoise.start();
    }

    function toggleAudio() {
      initAudio();
      audioCtx.resume();
      const iconOff = document.getElementById('audio-icon-off');
      const iconOn = document.getElementById('audio-icon-on');
      if (!isAudioPlaying) {
        masterGain.gain.setTargetAtTime(0.25, audioCtx.currentTime, 1.2);
        isAudioPlaying = true;
        iconOff.style.display = 'none';
        iconOn.style.display = 'block';
      } else {
        masterGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 1.0);
        isAudioPlaying = false;
        iconOff.style.display = 'block';
        iconOn.style.display = 'none';
      }
    }

    function triggerFistSound(isForming) {
      if (!audioCtx) initAudio();
      audioCtx.resume();

      if (isForming) {

        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(60, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.6);
        g.gain.setValueAtTime(0.01, audioCtx.currentTime);
        g.gain.linearRampToValueAtTime(0.35, audioCtx.currentTime + 0.4);
        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.9);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.95);
      } else {

        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(260, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.8);
        g.gain.setValueAtTime(0.3, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.85);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.9);
      }
    }

    function triggerImpactSound(power = 1.0) {
      if (!audioCtx) initAudio();
      audioCtx.resume();
      
      const t = audioCtx.currentTime;

      const subOsc = audioCtx.createOscillator();
      const subGain = audioCtx.createGain();
      subOsc.type = 'triangle';
      subOsc.frequency.setValueAtTime(160, t);
      subOsc.frequency.exponentialRampToValueAtTime(30, t + 0.45);
      subGain.gain.setValueAtTime(0.55 * power, t);
      subGain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      subOsc.connect(subGain);
      subGain.connect(audioCtx.destination);
      subOsc.start(t);
      subOsc.stop(t + 0.55);

      const bufferSize = Math.floor(audioCtx.sampleRate * 0.35);
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.07));
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(950, t);
      filter.Q.value = 2.8;
      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.42 * power, t);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      noise.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);
      noise.start(t);
    }



    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const rawDelta = clock.getDelta();
      const delta = rawDelta * cosmicTimeScale;
      const elapsed = clock.getElapsedTime() * (isTimeWarpActive ? 2.5 : 1.0);



      const flightSpeed = 140.0;
      const camDir = new THREE.Vector3();

      camDir.set(
        -Math.sin(rotationY) * Math.cos(rotationX),
        Math.sin(rotationX),
        -Math.cos(rotationY) * Math.cos(rotationX)
      ).normalize();

      if (isTwoFingerFlying || isKeyboardFlyingForward) {
        flightVelocity.addScaledVector(camDir, flightSpeed * delta);
      }
      if (isKeyboardFlyingBackward || isPinkyFlyingBackward) {
        flightVelocity.addScaledVector(camDir, -flightSpeed * 0.7 * delta);
      }

      flightVelocity.multiplyScalar(0.93);
      cameraX += flightVelocity.x * delta;
      cameraY += flightVelocity.y * delta;
      cameraZ += flightVelocity.z * delta;

      if (isAutoNavigating && autoNavTimer > 0) {
        autoNavTimer -= delta;
        const toCelestial = new THREE.Vector3().subVectors(autoNavTarget, new THREE.Vector3(cameraX, cameraY, cameraZ));
        const celestialDist = toCelestial.length();
        const minApproachDist = isLandingMode ? 2.0 : 8.0;

        if (celestialDist > minApproachDist) {
          toCelestial.normalize();

          const warpSpeed = isLandingMode
            ? Math.min(320.0, 30.0 + celestialDist * 0.8)
            : Math.min(480.0, 45.0 + celestialDist * 0.9);
          flightVelocity.addScaledVector(toCelestial, warpSpeed * delta);

          const targetYaw = Math.atan2(-toCelestial.x, -toCelestial.z);
          const targetPitch = Math.asin(toCelestial.y);
          targetRotationY += (targetYaw - targetRotationY) * 0.035;
          targetRotationX += (targetPitch - targetRotationX) * 0.035;
        }

        if (currentTargetPlanet) {
          const distToCenter = new THREE.Vector3(cameraX, cameraY, cameraZ).distanceTo(currentTargetPlanet.pos);
          const atmosRadius = currentTargetPlanet.r * 2.2;
          if (distToCenter < atmosRadius) {
            const entryFactor = 1.0 - (distToCenter - currentTargetPlanet.r) / (atmosRadius - currentTargetPlanet.r);
            if (reentryOverlayEl) {
              reentryOverlayEl.style.opacity = Math.max(0, Math.min(0.65, entryFactor * 0.75)).toString();
            }
          } else {
            if (reentryOverlayEl && !isLandingMode) {
              reentryOverlayEl.style.opacity = '0';
            }
          }
        }

        if (autoNavTimer <= 0 || celestialDist <= minApproachDist) {
          isAutoNavigating = false;
        }
      }

      if (isKeyboardTurnLeft) targetRotationY += delta * 1.6;
      if (isKeyboardTurnRight) targetRotationY -= delta * 1.6;

      if (isCameraActive) {
        const steerY = (handTrackingActive ? handSteerYaw : 0) + (headTrackingActive ? headSteerYaw : 0);
        const steerX = (handTrackingActive ? handSteerPitch : 0) + (headTrackingActive ? headSteerPitch : 0);
        targetRotationY += steerY * delta * 1.35;
        targetRotationX = THREE.MathUtils.clamp(targetRotationX + steerX * delta * 1.1, -Math.PI / 2.2, Math.PI / 2.2);
      }
      rotationX += (targetRotationX - rotationX) * 0.055;
      rotationY += (targetRotationY - rotationY) * 0.055;
      if (isTwoFingerFlying || isPinkyFlyingBackward || isKeyboardFlyingForward || isKeyboardFlyingBackward || isAutoNavigating || Math.hypot(cameraX, cameraY, cameraZ) > 160) {
        targetCameraX = cameraX;
        targetCameraY = cameraY;
        targetCameraZ = cameraZ;
      } else {
        cameraZ += (targetCameraZ - cameraZ) * 0.015;
        cameraX += (targetCameraX - cameraX) * 0.015;
        cameraY += (targetCameraY - cameraY) * 0.015;
      }

      
      const camDistFromOrigin = Math.hypot(cameraX, cameraY, cameraZ);
      const boundaryThreshold = UNIVERSE_BOUNDARY_RADIUS * 0.72;

      if (camDistFromOrigin > UNIVERSE_BOUNDARY_RADIUS) {
        const factor = UNIVERSE_BOUNDARY_RADIUS / camDistFromOrigin;
        cameraX *= factor;
        cameraY *= factor;
        cameraZ *= factor;
        flightVelocity.multiplyScalar(0.2);
        isAtBoundary = true;
      } else {
        isAtBoundary = (camDistFromOrigin > boundaryThreshold);
      }

      if (deityParticleSystem && deityTargetCoords) {

        triggerWarpChime();
        if (reentryOverlayEl) {
          reentryOverlayEl.style.opacity = '1.0';
          setTimeout(() => { reentryOverlayEl.style.opacity = '0'; }, 1500);
        }
      }


      for (let b = 0; b < birds.length; b++) {
        const bird = birds[b];
        bird.angle += delta * bird.speed;
        bird.group.position.x = Math.cos(bird.angle) * bird.radius;
        bird.group.position.z = Math.sin(bird.angle) * bird.radius;
        bird.group.rotation.y = -bird.angle + Math.PI / 2;
        const wingFlap = Math.sin(elapsed * 14.0 + b) * 0.45;
        bird.wingL.rotation.z = wingFlap;
        bird.wingR.rotation.z = -wingFlap;
      }

      for (let d = 0; d < deerList.length; d++) {
        const deer = deerList[d];
        const walk = Math.sin(elapsed * 4.0 + d);
        deer.legs[0].rotation.x = walk * 0.35;
        deer.legs[1].rotation.x = -walk * 0.35;
        deer.legs[2].rotation.x = -walk * 0.35;
        deer.legs[3].rotation.x = walk * 0.35;
      }

      for (let dp = 0; dp < dolphins.length; dp++) {
        const dol = dolphins[dp];
        const leap = Math.sin(elapsed * 2.2 + dol.phase);
        dol.mesh.position.y = Math.max(0, leap * 4.5);
        dol.mesh.rotation.x = Math.PI / 2 - (leap * 0.6);
      }

      for (let n = 0; n < npcList.length; n++) {
        const npc = npcList[n];
        npc.walkCycle += delta * npc.speed * 4.5;
        const legSwing = Math.sin(npc.walkCycle);
        npc.legL.rotation.x = legSwing * 0.45;
        npc.legR.rotation.x = -legSwing * 0.45;
        npc.armL.rotation.x = -legSwing * 0.4;
        npc.armR.rotation.x = legSwing * 0.4;

        npc.group.position.x += Math.cos(npc.dir) * delta * npc.speed * 1.5;
        npc.group.position.z += Math.sin(npc.dir) * delta * npc.speed * 1.5;
        if (Math.abs(npc.group.position.x + 45) > 35 || Math.abs(npc.group.position.z + 30) > 35) {
          npc.dir += Math.PI * 0.8;
          npc.group.rotation.y = npc.dir;
        }
      }

      const sPos = beltGeo.attributes.position.array;
      for (let i = 0; i < beltCount; i++) {
        const idx = i * 3;
        sPos[idx]     += beltVelocities[idx]     * delta * 12;
        sPos[idx + 1] += beltVelocities[idx + 1] * delta * 12;
        sPos[idx + 2] += beltVelocities[idx + 2] * delta * 12;

        if (Math.abs(sPos[idx]) > 13000) sPos[idx] *= -0.96;
        if (Math.abs(sPos[idx + 1]) > 9000) sPos[idx + 1] *= -0.96;
        if (Math.abs(sPos[idx + 2]) > 13000) sPos[idx + 2] *= -0.96;
      }
      beltGeo.attributes.position.needsUpdate = true;

      astralGodGroup.rotation.y = Math.sin(elapsed * 0.12) * 0.08;
      astralGodGroup.position.y = 280 + Math.sin(elapsed * 0.4) * 4.5;
      sudarshanaGroup.rotation.z = elapsed * 3.5;
      sudarshanaOuterDisc.rotation.z = elapsed * -1.2;
      chakraOuterMat.opacity = 0.68 + Math.sin(elapsed * 6.0) * 0.18;
      chakraInnerMat.opacity = 0.55 + Math.sin(elapsed * 8.0) * 0.22;
      chakraLight.intensity = 4.0 + Math.sin(elapsed * 7.5) * 2.5;

      const aPos = astralGeo.attributes.position.array;
      for (let i = 0; i < astralCount; i += 6) {
        const idx = i * 3;
        aPos[idx]     += Math.sin(elapsed * 2.0 + i * 0.1) * 0.015;
        aPos[idx + 1] += Math.cos(elapsed * 1.5 + i * 0.08) * 0.012;
      }
      astralGeo.attributes.position.needsUpdate = true;



      camera.updateMatrixWorld();
      const camM = camera.matrixWorld.elements;
      const r00 = camM[0], r01 = camM[4], r02 = camM[8];
      const r10 = camM[1], r11 = camM[5], r12 = camM[9];
      const r20 = camM[2], r21 = camM[6], r22 = camM[10];

      for (let f = 0; f < dualFists.length; f++) {
        const fist = dualFists[f];
        if (!fist.prevWorldPos) fist.prevWorldPos = fist.currentWorldPos.clone();

        const localFistPos = new THREE.Vector3(
          fist.targetWorldPos.x,
          fist.targetWorldPos.y,
          fist.targetWorldPos.z - 50
        );
        const worldFistTarget = localFistPos.applyQuaternion(camera.quaternion).add(camera.position);
        fist.currentWorldPos.lerp(worldFistTarget, 0.18);

        const moveDX = fist.currentWorldPos.x - fist.prevWorldPos.x;
        const moveDY = fist.currentWorldPos.y - fist.prevWorldPos.y;
        const moveDZ = fist.currentWorldPos.z - fist.prevWorldPos.z;
        fist.prevWorldPos.copy(fist.currentWorldPos);

        const targetF = fist.isClenched ? 1.0 : 0.0;
        fist.transitionFactor += (targetF - fist.transitionFactor) * (fist.isClenched ? 0.045 : 0.035);
        const factor = fist.transitionFactor;

        if (fist.lastFactor < 0.95 && factor >= 0.95) {
          shockwaveActive = true;
          shockwaveRadius = 1.0;
          shockwaveOpacity = 1.0;
          shockwaveRing.position.copy(fist.currentWorldPos);
          triggerFistSound(true);
        }
        if (fist.lastFactor > 0.1 && factor <= 0.1) {
          triggerFistSound(false);
        }
        fist.lastFactor = factor;

        fist.coreLight.intensity = factor * 6.5 + Math.sin(elapsed * 10.0 + f * 3.0) * (factor * 2.0);
        fist.coreLight.position.copy(fist.currentWorldPos);

        const posArray = fist.geo.attributes.position.array;
        const colArray = fist.geo.attributes.color.array;

        for (let i = 0; i < fist.count; i++) {
          const idx = i * 3;
          const delay = fist.delays[i];

          const rawFactor = factor < 0.001
            ? 0.0
            : Math.max(0, Math.min(1, (factor - delay * 0.42) / 0.58));
          const pFactor = rawFactor * rawFactor * (3 - 2 * rawFactor);

          fist.originPos[idx] += moveDX;
          fist.originPos[idx + 1] += moveDY;
          fist.originPos[idx + 2] += moveDZ;
          const origX = fist.originPos[idx];
          const origY = fist.originPos[idx + 1];
          const origZ = fist.originPos[idx + 2];

          const ltx = fist.fistTargets[idx];
          const lty = fist.fistTargets[idx + 1];
          const ltz = fist.fistTargets[idx + 2];
          const targetX = (r00 * ltx + r01 * lty + r02 * ltz) + fist.currentWorldPos.x;
          const targetY = (r10 * ltx + r11 * lty + r12 * ltz) + fist.currentWorldPos.y;
          const targetZ = (r20 * ltx + r21 * lty + r22 * ltz) + fist.currentWorldPos.z;

          if (pFactor > 0.001) {
            const swirlAngle = (1.0 - pFactor) * 3.5 + elapsed * (fist.isLeft ? -0.5 : 0.5);
            const cosS = Math.cos(swirlAngle * (1.0 - pFactor));
            const sinS = Math.sin(swirlAngle * (1.0 - pFactor));
            const dx = origX - fist.currentWorldPos.x;
            const dz = origZ - fist.currentWorldPos.z;
            const swirledX = fist.currentWorldPos.x + (dx * cosS - dz * sinS);
            const swirledZ = fist.currentWorldPos.z + (dx * sinS + dz * cosS);

            posArray[idx]     = THREE.MathUtils.lerp(swirledX, targetX, pFactor);
            posArray[idx + 1] = THREE.MathUtils.lerp(origY, targetY, pFactor);
            posArray[idx + 2] = THREE.MathUtils.lerp(swirledZ, targetZ, pFactor);

            if (pFactor > 0.88) {
              const jitter = (1.0 - pFactor) * 0.4 + 0.05;
              posArray[idx]     += (Math.random() - 0.5) * jitter;
              posArray[idx + 1] += (Math.random() - 0.5) * jitter;
              posArray[idx + 2] += (Math.random() - 0.5) * jitter;
            }

            const glow = pFactor * pFactor;
            if (fist.isLeft) {
              colArray[idx]     = THREE.MathUtils.lerp(0.6, 0.22, glow);
              colArray[idx + 1] = THREE.MathUtils.lerp(0.75, 0.74, glow);
              colArray[idx + 2] = THREE.MathUtils.lerp(1.0, 0.97, glow);
            } else {
              colArray[idx]     = THREE.MathUtils.lerp(1.0, 1.0, glow);
              colArray[idx + 1] = THREE.MathUtils.lerp(0.6, 0.47, glow);
              colArray[idx + 2] = THREE.MathUtils.lerp(0.3, 0.13, glow);
            }
          } else {

            posArray[idx]     += moveDX + (Math.random() - 0.5) * 0.02;
            posArray[idx + 1] += moveDY + (Math.random() - 0.5) * 0.02;
            posArray[idx + 2] += moveDZ + (Math.random() - 0.5) * 0.02;
            colArray[idx]     = THREE.MathUtils.lerp(colArray[idx], 0.5, 0.02);
            colArray[idx + 1] = THREE.MathUtils.lerp(colArray[idx + 1], 0.55, 0.02);
            colArray[idx + 2] = THREE.MathUtils.lerp(colArray[idx + 2], 0.65, 0.02);
          }
        }

        fist.geo.attributes.position.needsUpdate = true;
        fist.geo.attributes.color.needsUpdate = true;

        const chakraVis = THREE.MathUtils.clamp(factor * 1.4 - 0.35, 0, 1);
        fist.chakraRing.position.copy(fist.currentWorldPos);
        fist.chakraRing.quaternion.copy(camera.quaternion);
        fist.chakraRing.rotateZ(elapsed * (fist.isLeft ? -3.8 : 3.8));
        const chakraScale = 2.5 + factor * 10.0 + Math.sin(elapsed * 7.5 + f) * factor * 2.0;
        fist.chakraRing.scale.setScalar(chakraScale);
        fist.chakraRingMat.opacity = chakraVis * 0.65 + Math.sin(elapsed * 6.0 + f) * chakraVis * 0.15;

        fist.chakraInner.position.copy(fist.currentWorldPos);
        fist.chakraInner.quaternion.copy(camera.quaternion);
        fist.chakraInner.rotateZ(-elapsed * (fist.isLeft ? -4.2 : 4.2));
        fist.chakraInnerMat.opacity = chakraVis * 0.35;
      }

      if (shockwaveActive) {
        shockwaveRadius += delta * 28;
        shockwaveOpacity = Math.max(0, 1.0 - (shockwaveRadius - 1) / 22);
        shockwaveRing.scale.setScalar(shockwaveRadius);
        shockwaveMat.opacity = shockwaveOpacity * 0.9;
        if (shockwaveOpacity <= 0) {
          shockwaveActive = false;
          shockwaveMat.opacity = 0;
        }
      }



      const ambPos = ambientGeo.attributes.position.array;
      for (let i = 0; i < ambientCount; i += 4) {
        const idx = i * 3;
        ambPos[idx]     += ambientVel[idx]     * delta * 8;
        ambPos[idx + 1] += ambientVel[idx + 1] * delta * 8;
        ambPos[idx + 2] += ambientVel[idx + 2] * delta * 8;
        if (Math.abs(ambPos[idx]) > 1400) ambPos[idx] *= -0.98;
        if (Math.abs(ambPos[idx + 1]) > 400) ambPos[idx + 1] *= -0.98;
        if (Math.abs(ambPos[idx + 2]) > 1400) ambPos[idx + 2] *= -0.98;
      }
      ambientGeo.attributes.position.needsUpdate = true;



      let debrisActive = false;
      for (let i = 0; i < maxDebris; i++) {
        if (debrisLifespans[i] > 0) {
          debrisLifespans[i] -= delta * 1.6;
          debrisPositions[i * 3]     += debrisVelocities[i * 3]     * delta;
          debrisPositions[i * 3 + 1] += debrisVelocities[i * 3 + 1] * delta;
          debrisPositions[i * 3 + 2] += debrisVelocities[i * 3 + 2] * delta;

          debrisVelocities[i * 3]     *= 0.94;
          debrisVelocities[i * 3 + 1] *= 0.94;
          debrisVelocities[i * 3 + 2] *= 0.94;

          if (debrisLifespans[i] <= 0) {
            debrisPositions[i * 3 + 1] = -9999;
          }
          debrisActive = true;
        }
      }
      if (debrisActive) {
        debrisGeo.attributes.position.needsUpdate = true;
      }



      for (let f = 0; f < dualFists.length; f++) {
        const fist = dualFists[f];
        const fistEffectiveRadius = THREE.MathUtils.lerp(4.0, 7.8, fist.transitionFactor);

        for (let i = 0; i < interactiveAsteroids.length; i++) {
          const ast = interactiveAsteroids[i];
          if (ast.hitCooldown > 0) continue;

          const toAst = new THREE.Vector3().subVectors(ast.mesh.position, fist.currentWorldPos);
          const dist = toAst.length();
          const hitRadius = ast.radius + fistEffectiveRadius;

          if (dist < hitRadius && ast.hitCooldown <= 0) {
            ast.hitCooldown = 0.32;

            const punchDir = toAst.normalize();
            if (punchDir.lengthSq() < 0.001) punchDir.set(0, 0, -1);

            const isSuperPunch = fist.transitionFactor > 0.45;
            const impulsePower = isSuperPunch ? 72.0 : 30.0;

            ast.velocity.addScaledVector(punchDir, impulsePower);
            ast.angularVel.x += (Math.random() - 0.5) * 0.5;
            ast.angularVel.y += (Math.random() - 0.5) * 0.5;
            ast.angularVel.z += (Math.random() - 0.5) * 0.5;

            ast.material.emissive.setHex(fist.isLeft ? 0x38bdf8 : 0xff7722);
            ast.flashTimer = 0.32;

            const contactPoint = fist.currentWorldPos.clone().addScaledVector(punchDir, fistEffectiveRadius);
            spawnDebris(contactPoint, isSuperPunch ? 35 : 18, punchDir, isSuperPunch ? 1.4 : 0.85);

            triggerImpactSound(isSuperPunch ? 1.0 : 0.6);
            screenShakeIntensity = isSuperPunch ? 1.6 : 0.7;

            shockwaveActive = true;
            shockwaveRadius = 1.0;
            shockwaveOpacity = 1.0;
            shockwaveRing.position.copy(contactPoint);
          }
        }
      }

      for (let i = 0; i < interactiveAsteroids.length; i++) {
        const ast = interactiveAsteroids[i];
        if (ast.hitCooldown > 0) ast.hitCooldown -= delta;

        ast.mesh.position.addScaledVector(ast.velocity, delta);
        ast.mesh.rotation.x += ast.angularVel.x;
        ast.mesh.rotation.y += ast.angularVel.y;
        ast.mesh.rotation.z += ast.angularVel.z;

        ast.velocity.multiplyScalar(0.965);
        ast.angularVel.multiplyScalar(0.985);

        const driftFromHome = new THREE.Vector3().subVectors(ast.homePos, ast.mesh.position);
        if (driftFromHome.length() > 0.5) {
          ast.mesh.position.addScaledVector(driftFromHome, delta * 0.85);
        }

        if (ast.flashTimer > 0) {
          ast.flashTimer -= delta;
          if (ast.flashTimer <= 0) {
            ast.material.emissive.setHex(0x000000);
          }
        }
      }

      deepStarField.rotation.y = elapsed * 0.0003;
      outerStarField.rotation.y = -elapsed * 0.00018;
      for (let op = 0; op < outerPlanets.length; op++) {
        outerPlanets[op].mesh.rotation.y += delta * outerPlanets[op].speed;
      }
      for (let og = 0; og < outerGalaxies.length; og++) {
        outerGalaxies[og].rotation.y += delta * 0.06;
      }
      for (let b = 0; b < outerBlackHoles.length; b++) {
        outerBlackHoles[b].disk.rotation.z += delta * 1.4;
        outerBlackHoles[b].photonRing.lookAt(camera.position);
      }
      for (let w = 0; w < outerWormholes.length; w++) {
        const wh = outerWormholes[w];
        wh.group.lookAt(camera.position);
        for (let r = 0; r < wh.rings.length; r++) {
          wh.rings[r].rotation.z += delta * (1.2 + r * 0.45) * (r % 2 === 0 ? 1 : -1);
        }
      }
      for (let es = 0; es < explodingSuns.length; es++) {
        const sun = explodingSuns[es];
        const pulse = (elapsed * 0.65 + sun.phase) % 1.0;
        sun.shockwave.scale.setScalar(0.8 + pulse * 3.8);
        sun.shockwave.material.opacity = (1.0 - pulse) * 0.55;
        sun.core.scale.setScalar(1.0 + Math.sin(elapsed * 8.0 + sun.phase) * 0.15);
        const fPos = sun.flarePoints.geometry.attributes.position.array;
        for (let i = 0; i < fPos.length; i += 3) {
          const dist = ((elapsed * 55 + (i % 140) + sun.phase * 40) % 160) + 22;
          fPos[i]     = sun.flareDir[i] * dist;
          fPos[i + 1] = sun.flareDir[i + 1] * dist;
          fPos[i + 2] = sun.flareDir[i + 2] * dist;
        }
        sun.flarePoints.geometry.attributes.position.needsUpdate = true;
      }
      for (let ab = 0; ab < outerAsteroidBelts.length; ab++) {
        outerAsteroidBelts[ab].rotation.y += delta * 0.04;
      }
      plutoOuterGroup.rotation.y += delta * 0.12;
      for (let p = 0; p < outerPulsars.length; p++) {
        outerPulsars[p].group.rotation.y += delta * outerPulsars[p].speed;
      }
      for (let d = 0; d < dysonSpheres.length; d++) {
        const ds = dysonSpheres[d];
        for (let r = 0; r < ds.cageRings.length; r++) {
          ds.cageRings[r].rotation.x += delta * (0.35 + r * 0.12);
          ds.cageRings[r].rotation.y += delta * (0.28 + r * 0.1);
        }
      }
      for (let c = 0; c < outerComets.length; c++) {
        const cm = outerComets[c];
        const a = elapsed * cm.speed + cm.offset;
        const nx = Math.cos(a) * cm.orbitR;
        const nz = Math.sin(a) * cm.orbitR;
        const ny = cm.yBase + Math.sin(a * 2.0) * 140;
        cm.group.position.set(nx, ny, nz);
        cm.group.lookAt(
          Math.cos(a + 0.05) * cm.orbitR,
          cm.yBase + Math.sin((a + 0.05) * 2.0) * 140,
          Math.sin(a + 0.05) * cm.orbitR
        );
      }

      renderer.render(cosmosScene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    setTimeout(() => {
      const hintEl = document.getElementById('hint');
      if (hintEl) hintEl.classList.add('fade-out');
    }, 4500);
  </script>
<div class="credit" style="position:fixed;bottom:8px;left:8px;color:#aaa;font-size:0.9rem;z-index:20;pointer-events:none;">Built by Sital Kumar</div>
